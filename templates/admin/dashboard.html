{% extends "base.html" %}
{% block title %}Admin Dashboard{% endblock %}
{% block content %}
<div style="display:flex;justify-content:space-between;align-items:center">
  <h2>Admin Panel</h2>
  <form method="post" action="{{ url_for('admin_logout') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <button class="btn red">Logout</button>
  </form>
</div>

<div class="card">
  <h3>Upload New File</h3>
  <form method="post" action="{{ url_for('admin_upload') }}" enctype="multipart/form-data">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Title *</label>
    <input name="title" required>
    <label>Description</label>
    <textarea name="description" rows="5"></textarea>
    <label>Telegram Bot Token</label>
    <input name="bot_token" placeholder="123456:ABC-DEF...">
    <label>Telegram Chat ID</label>
    <input name="chat_id" placeholder="-100123456789 or @channelname">
    <label>File / APK *</label>
    <input type="file" name="file" required>
    <button class="btn" type="submit">Upload</button>
  </form>
</div>

<div class="card" style="overflow-x:auto">
  <h3>Uploaded Files ({{ files|length }})</h3>
  <table>
    <tr><th>Title</th><th>Size</th><th>Downloads</th><th></th></tr>
    {% for f in files %}
    <tr>
      <td><a href="{{ url_for('view_file', file_id=f.id) }}">{{ f.title }}</a></td>
      <td>{{ f.file_size|filesize }}</td>
      <td>{{ f.downloads }}</td>
      <td>
        <form method="post" action="{{ url_for('admin_delete', file_id=f.id) }}"
              onsubmit="return confirm('Delete this file?')">
          <input type="hidden" name="csrf" value="{{ csrf_token() }}">
          <button class="btn red">Delete</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
